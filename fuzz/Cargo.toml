[package]
name = "stuffr-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
stuffr = { path = "../crates/stuffr", features = ["testing", "legacy"] }
stuffr-core = { path = "../crates/stuffr-core", features = ["testing"] }
# `salvage.rs`'s only use of this crate directly: a second, independent call
# to `zip_salvage::salvage_zip`/`legacy::arc_salvage::salvage_arc` over the
# identical bytes `entries::salvage` (via `stuffr`) already scanned, purely
# to recover each scan position's byte OFFSET — `entries::salvage`'s own
# `SalvagedRecord` does not carry one. Same deliberate-duplication reasoning
# as `container.rs`'s independent EOCD re-parse, immediately below. `arc`
# joined `zip` here when Task 3b converted `salvage.rs` from a pinned format
# to `SALVAGE_SLOTS`'s selector byte — the same two formats that selector
# lists.
stuffr-formats = { path = "../crates/stuffr-formats", features = ["zip", "arc"] }
tempfile = "3"
# Only for `container.rs`'s independent EOCD re-parse (Ruling A's second
# guard) — opens a SECOND `zip::ZipArchive` over the same bytes stuffr's own
# `zip.rs` already opened, so the two can be compared from outside. Metadata
# only, never decoding an entry, so no codec features are needed.
zip = { version = "8.6", default-features = false }

[[bin]]
name = "codec"
path = "fuzz_targets/codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "container"
path = "fuzz_targets/container.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chain"
path = "fuzz_targets/chain.rs"
test = false
doc = false
bench = false

# Phase 3c Task 8. The only target that runs an ENCODER: the other three
# feed their input to a decoder, so nothing in this harness executed
# `Codec::encoder` or `Container::create`/`add`/`finish` at all until this
# one existed.
[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

# Salvage Stage 1 Task 8. Arbitrary bytes as a damaged ARCHIVE, unlike every
# target above: those all treat bytes as CONTENT fed to a decoder or
# container reader; this one is the one place bytes are handed to a scanner
# built to expect them hostile by construction (a truncated, mutated or
# outright fabricated zip). Fifth target — see the Makefile's own note on why
# its "four targets" language needed a hand-edit here.
[[bin]]
name = "salvage"
path = "fuzz_targets/salvage.rs"
test = false
doc = false
bench = false
