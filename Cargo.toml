[workspace]
members = ["crates/stuffr-core", "crates/stuffr-formats", "crates/stuffr", "crates/stuffr-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/codedeviate/stuffr"

[workspace.dependencies]
stuffr-core = { path = "crates/stuffr-core", version = "0.1.0" }
stuffr-formats = { path = "crates/stuffr-formats", version = "0.1.0" }
thiserror = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
bzip2 = "0.6"
brotli = "8"
lz4_flex = "0.14"
snap = "1"
# `zstdmt` is required, not decorative: `Encoder::multithread` does not exist
# without it. The method is present in the crate's source unconditionally, so
# grepping for it says nothing about whether you can call it — a distinction
# that cost Task 4 a discovery. It enables multithreading inside the vendored C
# library and is reachable only through `zstd-c`, so the `pure` graph is
# unaffected; a CI job asserts that.
zstd = { version = "0.13", features = ["zstdmt"] }
# The exact pin is gone. Under the old 1.85 floor there was no choice: 0.9.0
# declares `rust-version = "1.87"` and cargo refused it, and 0.8.2 declares no
# `rust-version` at all while using a 1.87 stdlib method, so it built on a modern
# toolchain and failed only under 1.85. Raising the floor to 1.88 freed both.
#
# Upgrading did NOT let any workaround in `zstd_pure.rs` be deleted — all three
# defects it guards against persist in 0.9.0, re-measured: `Default`/`Better`/
# `Best` still panic with `not implemented`, the content checksum is still never
# verified on read (28 of 64 swept positions decoded silently wrong through the
# raw decoder), and multi-frame `.zst` is still truncated to its first frame
# (1,200 of 2,500 bytes). Do not remove those guards on the assumption that a
# newer version fixed them; re-measure first.
#
# What the upgrade did buy, besides a caret range: better corruption detection.
# 0.9.0 added a 100 MiB window-size cap, so a corrupted window descriptor is now
# refused instead of honoured, and detection on a checksummed stream is complete
# (4,109 of 4,109) where 0.8.1 left that one byte undetected.
ruzstd = "0.9"
# Not the bare `liblzma = "0.4"` a plain `cargo add` would produce. Default
# features pull in `bindgen` (needs libclang at build time) and, without
# `static`, `liblzma-sys`'s build.rs takes a pkg-config path linking a
# *system* liblzma instead of building one — silently fine on a developer
# machine with Homebrew's `xz` installed, broken on a clean one or CI. This
# line vendors and builds `liblzma.a` from source instead: no pkg-config, no
# system library, no libclang. Verified: zstd plus liblzma builds in ~8s.
#
# `parallel` (Phase 1f, Task 5) is required for `MtStreamBuilder` — it is not
# reachable without it, even though the symbol appears in the crate's source.
# It pulls in `num_cpus`, confined to this `c-backed` dependency graph; the
# `pure` graph is unaffected (verified with `cargo tree -p stuffr
# --no-default-features --features pure -e normal`).
liblzma = { version = "0.4", default-features = false, features = ["static", "parallel"] }
# The pure-Rust xz backend (Task 5 of Phase 1e): a port of Tukaani's "XZ for
# Java" that both encodes and decodes, unlike zstd's decode-only pure
# fallback. Pure Rust (`sha2` + `digest`, no `-sys` crate), `rust-version =
# "1.85"` — below this workspace's floor since it moved to 1.88, so it
# imposes no constraint here — edition 2024, Apache-2.0 — the
# first non-MIT dependency reachable from a *default* build (see Task 8's
# README note).
lzma-rust2 = "0.20"
# `default-features = false` drops the `xattr` feature, which `tar` turns ON
# by default (`default = ["xattr"]`) and which is the only optional
# dependency in its graph — `xattr 1.1.3`, on unix. Nothing here needs it:
# stuffr never asks `tar` to touch the filesystem — `Container::open` hands it an in-memory `Source` and
# `Container::create` a `Box<dyn Write>`, and extraction is `ops`'s job, done
# entry by entry through `safe_join`. Reading or writing extended attributes
# via `tar`'s own unpack path would bypass that gate entirely, so the feature
# is not merely unused, it is one this project must not use.
tar = { version = "0.4.46", default-features = false }
clap = { version = "4", features = ["derive"] }
