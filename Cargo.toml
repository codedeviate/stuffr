[workspace]
members = ["crates/stuffr-core", "crates/stuffr-formats", "crates/stuffr", "crates/stuffr-cli"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/codedeviate/stf"

[workspace.dependencies]
stuffr-core = { path = "crates/stuffr-core", version = "0.0.1" }
stuffr-formats = { path = "crates/stuffr-formats", version = "0.0.1" }
thiserror = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
bzip2 = "0.6"
brotli = "8"
lz4_flex = "0.14"
snap = "1"
zstd = "0.13"
# Exact-pinned, not a caret range, and pinned BELOW `cargo add`'s own pick.
# Pinned exactly, and the pin is now a scheduled debt rather than a permanent
# constraint. Under the old 1.85 floor there was no choice: 0.9.0 declares
# `rust-version = "1.87"` and cargo refuses it outright, and 0.8.2 declares no
# `rust-version` at all while using `unsigned_is_multiple_of` (stabilised 1.87),
# so it builds on a modern toolchain and fails only under 1.85 — an upstream
# packaging bug that CI's msrv job is exactly what catches.
#
# Raising the floor to 1.88 unblocks 0.9.0. The upgrade is NOT automatic,
# because `zstd_pure.rs` carries three workarounds for defects measured in
# 0.8.1 — three compression levels that panic rather than error, a content
# checksum written but never verified on read, and multi-frame `.zst` silently
# truncated to its first frame. Some may be fixed upstream, which would let the
# workarounds be deleted; others may not. Each must be re-measured against 0.9.0
# before the pin moves, so the upgrade is its own task with its own review.
ruzstd = "=0.8.1"
# Not the bare `liblzma = "0.4"` a plain `cargo add` would produce. Default
# features pull in `bindgen` (needs libclang at build time) and, without
# `static`, `liblzma-sys`'s build.rs takes a pkg-config path linking a
# *system* liblzma instead of building one — silently fine on a developer
# machine with Homebrew's `xz` installed, broken on a clean one or CI. This
# line vendors and builds `liblzma.a` from source instead: no pkg-config, no
# system library, no libclang. Verified: zstd plus liblzma builds in ~8s.
liblzma = { version = "0.4", default-features = false, features = ["static"] }
# The pure-Rust xz backend (Task 5 of Phase 1e): a port of Tukaani's "XZ for
# Java" that both encodes and decodes, unlike zstd's decode-only pure
# fallback. Pure Rust (`sha2` + `digest`, no `-sys` crate), `rust-version =
# "1.85"` exactly on this workspace's floor, edition 2024, Apache-2.0 — the
# first non-MIT dependency reachable from a *default* build (see Task 8's
# README note).
lzma-rust2 = "0.20"
clap = { version = "4", features = ["derive"] }
