[workspace]
members = ["crates/stuffr-core", "crates/stuffr-formats", "crates/stuffr", "crates/stuffr-cli"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/codedeviate/stuffr"

[workspace.dependencies]
stuffr-core = { path = "crates/stuffr-core", version = "0.5.0" }
stuffr-formats = { path = "crates/stuffr-formats", version = "0.5.0" }
thiserror = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
bzip2 = "0.6"
brotli = "8"
lz4_flex = "0.14"
snap = "1"
# `zstdmt` is required, not decorative: `Encoder::multithread` does not exist
# without it. The method is present in the crate's source unconditionally, so
# grepping for it says nothing about whether you can call it — a distinction
# that cost Task 4 a discovery. It enables multithreading inside the vendored C
# library and is reachable only through `zstd-c`, so the `pure` graph is
# unaffected; a CI job asserts that.
zstd = { version = "0.13", features = ["zstdmt"] }
# The exact pin is gone. Under the old 1.85 floor there was no choice: 0.9.0
# declares `rust-version = "1.87"` and cargo refused it, and 0.8.2 declares no
# `rust-version` at all while using a 1.87 stdlib method, so it built on a modern
# toolchain and failed only under 1.85. Raising the floor to 1.88 freed both.
#
# Upgrading did NOT let any workaround in `zstd_pure.rs` be deleted — all three
# defects it guards against persist in 0.9.0, re-measured: `Default`/`Better`/
# `Best` still panic with `not implemented`, the content checksum is still never
# verified on read (28 of 64 swept positions decoded silently wrong through the
# raw decoder), and multi-frame `.zst` is still truncated to its first frame
# (1,200 of 2,500 bytes). Do not remove those guards on the assumption that a
# newer version fixed them; re-measure first.
#
# What the upgrade did buy, besides a caret range: better corruption detection.
# 0.9.0 added a 100 MiB window-size cap, so a corrupted window descriptor is now
# refused instead of honoured, and detection on a checksummed stream is complete
# (4,109 of 4,109) where 0.8.1 left that one byte undetected.
ruzstd = "0.9"
# Not the bare `liblzma = "0.4"` a plain `cargo add` would produce. Default
# features pull in `bindgen` (needs libclang at build time) and, without
# `static`, `liblzma-sys`'s build.rs takes a pkg-config path linking a
# *system* liblzma instead of building one — silently fine on a developer
# machine with Homebrew's `xz` installed, broken on a clean one or CI. This
# line vendors and builds `liblzma.a` from source instead: no pkg-config, no
# system library, no libclang. Verified: zstd plus liblzma builds in ~8s.
#
# `parallel` (Phase 1f, Task 5) is required for `MtStreamBuilder` — it is not
# reachable without it, even though the symbol appears in the crate's source.
# It pulls in `num_cpus`, confined to this `c-backed` dependency graph; the
# `pure` graph is unaffected (verified with `cargo tree -p stuffr
# --no-default-features --features pure -e normal`).
liblzma = { version = "0.4", default-features = false, features = ["static", "parallel"] }
# The pure-Rust xz backend (Task 5 of Phase 1e): a port of Tukaani's "XZ for
# Java" that both encodes and decodes, unlike zstd's decode-only pure
# fallback. Pure Rust (`sha2` + `digest`, no `-sys` crate), `rust-version =
# "1.85"` — below this workspace's floor since it moved to 1.88, so it
# imposes no constraint here — edition 2024, Apache-2.0 — the
# first non-MIT dependency reachable from a *default* build (see Task 8's
# README note).
lzma-rust2 = "0.20"
# `default-features = false` drops the `xattr` feature, which `tar` turns ON
# by default (`default = ["xattr"]`) and which is the only optional
# dependency in its graph — `xattr 1.1.3`, on unix. Nothing here needs it:
# stuffr never asks `tar` to touch the filesystem — `Container::open` hands it an in-memory `Source` and
# `Container::create` a `Box<dyn Write>`, and extraction is `ops`'s job, done
# entry by entry through `safe_join`. Reading or writing extended attributes
# via `tar`'s own unpack path would bypass that gate entirely, so the feature
# is not merely unused, it is one this project must not use.
tar = { version = "0.4.46", default-features = false }
# The simplest container in the tree: no trailer at all, so a reader knows
# it has reached the end only because the underlying stream has (`ar 0.9.0`).
#
# PINNED EXACTLY, and the pin is load-bearing. `ar.rs`'s `ArGuardedReader`
# and `scan_ar_header` mirror `ar::Header::read`'s PRIVATE header state
# machine, because the allocations and the slice index they bound all happen
# inside the crate, below anything this module can peek at. EIGHT facts about
# 0.9.0's internals are hard-coded there — the list said five until the Phase
# 3a whole-branch review recounted it, and the three it was missing are the
# ones a reader would never think to check:
#
#   1. the 60-byte header width;
#   2. the `[48..58]` file-size field;
#   3. the `[3..16]` BSD extended length field;
#   4. the `[1..16]` GNU short-name index;
#   5. the `size % 2` pad rule;
#   6. that the pad byte is consumed BEFORE the next header rather than after
#      the payload — the ORDERING fact 5's existence implies but does not
#      state, and what `ArGuardPhase::Pad -> Header` encodes;
#   7. that `ar::Entry`'s `Drop` drains the unread payload (`lib.rs:851`).
#      `ArGuardPhase::Payload`'s byte counter is only correct because every
#      payload byte is eventually pulled THROUGH the wrapper; a crate that
#      stopped draining would make the wrapper read the next header's bytes
#      as payload and then scan payload as headers — precisely the
#      false-positive failure this pin exists to prevent;
#   8. that the crate's read at `lib.rs:234` is UN-annotated, so the
#      `io::ErrorKind` the guards raise survives to `classify_ar_error`.
#      Annotate it upstream and `refuse_if_over`'s `OutOfMemory` stops
#      landing on `ResourceLimit` — a silently wrong exit code, not a
#      failure.
#
# — plus the GNU-before-BSD branch order the variant latch depends on. A
# 0.9.x patch release that changes ANY of them desyncs the mirror silently,
# and the symptom is the worst kind: the guard scans payload bytes as
# headers, and a coincidental `#1/<big>` or `//` inside a real object file
# produces a FALSE `ResourceLimit` (exit 6) or `Corrupt` (exit 5) on a
# perfectly valid archive. Nothing in the test suite would detect that — the
# suite proves the guard fires on hostile input, and the silent-on-real-input
# half was measured by sweeping every `.a`/`.rlib` on one machine. That
# figure and its scope live in `ar.rs`'s module doc (478 archives) and are
# deliberately NOT restated here: the count is a property of the machine, not
# of the guard — an independent later sweep on a differently-populated box
# found 444, every one silent — and a number duplicated across two files is a
# number that drifts. This note said 666 for exactly that reason.
#
# This is the same deliberate, documented cost `ruzstd = "=0.8.1"` carried
# under the MSRV section until 1.88 lifted it: an exact pin blocks
# patch-level fixes, and is worth it only while something concrete depends on
# the exact version. Before loosening this to a caret range, re-verify each
# of those eight facts against the new `ar` source line by line — or replace
# the mirror with a drift test that compares the guard's boundary walk
# against the crate's own entry offsets over a fixture set, which is what
# would make a caret range safe.
ar = "=0.9.0"
# `newc` only — the crate ships no odc or CRC variant, so this container
# declares exactly that rather than implying the others work.
cpio = "0.4"
# NOT `zip = "8.6"`. zip's default features include `zstd`, which pulls
# `zstd-sys` — a C-compiling crate — into every graph that touches this
# dependency, and the `purity` CI job fails the moment `zstd-sys` or
# `liblzma-sys` appears in a default-feature build. The curated list below is
# verified C-free: `deflate-flate2` routes deflate through `flate2` (already
# here), `bzip2` through `libbz2-rs-sys` (pure Rust since bzip2 0.6),
# `deflate64` and `ppmd` are pure-Rust decoders, and zip's `xz` and `lzma`
# features both resolve to `lzma-rust2` — the same crate this tree's pure xz
# and LZMA1 backends use, so no new licence (Apache-2.0, already reachable
# from a default build). Worth stating precisely rather than as "no new
# dependency", because it is not quite that: zip pins `lzma-rust2 ^0.16.1`
# while this workspace is on 0.20, and 0.x versions are semver-incompatible,
# so `cargo tree` shows BOTH 0.16.5 and 0.20.1 and both get compiled. That
# is compile time and binary size, not a new licence or a new C toolchain
# requirement; it resolves itself when zip catches up.
#
# `deflate-flate2` and NOT `deflate-flate2-zlib-rs`, which is the variant a
# reading of zip's feature list suggests. The `-zlib-rs` suffix turns on
# `flate2/zlib-rs`, and Cargo unifies features across the whole graph: it
# would therefore switch `gzip.rs`, `zlib.rs` and `deflate.rs` — three
# separately registered codecs with their own corruption sweeps, their own
# measured `io::ErrorKind` behaviour recorded in `normalize.rs`, and a
# reference-tool byte comparison — from `miniz_oxide` to `zlib-rs` as a side
# effect of adding a CONTAINER. Verified against flate2 1.1.10's
# `src/ffi/mod.rs:75`: the `miniz_oxide` module is compiled only under
# `all(not(feature = "any_zlib"), feature = "miniz_oxide")`, and `zlib-rs`
# implies `any_zlib`, so the swap is silent and total. Both variants are
# equally C-free, so nothing about the `purity` job motivates the wider one.
# Picking zlib-rs for this tree is a decision worth taking on its own merits;
# it is not one to make by accident here.
#
# `aes-crypto` is deliberately ABSENT: this build cannot decrypt an
# encrypted entry, and `zip.rs` reports that as an unsupported capability
# rather than as corruption. Adding it would also add five crypto crates to
# a default graph for a capability nothing here exposes yet.
#
# zip's `zstd` feature is reached only through `stuffr-formats/zip-zstd`,
# which the `c-backed` bundle turns on — see that feature's own comment.
zip = { version = "8.6", default-features = false, features = [
    "deflate-flate2",
    "bzip2",
    "deflate64",
    "xz",
    "lzma",
    "ppmd",
    "time",
] }
# Already in the graph as `zip`'s own dependency (its `time` feature), and
# named here only so `zip.rs` can reach the `TryFrom` impls between
# `zip::DateTime` and `time::PrimitiveDateTime` in both directions: a zip
# stores an MS-DOS civil (y, m, d, h, m, s) tuple while `EntryMeta::mtime` is
# a `SystemTime`, so something has to do the calendar arithmetic. Hand-rolling
# `days_from_civil`/`civil_from_days` here instead would put new
# calendar-maths code in an archive container, which is the wrong place for
# it. (`PrimitiveDateTime` and not `OffsetDateTime`: zip gates its
# `OffsetDateTime` conversions behind a `deprecated-time` feature this build
# does not enable.) `default-features = false` + `std` matches how zip
# declares it, so the two unify to one build of one version.
time = { version = "0.3", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
# All three pinned EXACTLY. Two different reasons:
#
# `delharc` — the maintained 0.8 line requires rustc 1.95 and this project's
# MSRV is 1.88, so 0.6.2 is the newest release that fits. Patch fixes on 0.8
# will not reach us until the MSRV moves; revisit this pin when it does, not
# before.
#
# `unarj-rs` — THREE reasons now, and only the first is an MSRV guard.
# Enumerated rather than summarised, the way `ar = "=0.9.0"` enumerates its
# eight, because a fact nobody wrote down is a fact that desyncs silently:
#
#   1. It declares no `rust-version` at all, so a patch release can raise the
#      MSRV with nothing to announce it (the `ruzstd` 0.8.2 failure mode under
#      MSRV in CLAUDE.md). The `msrv` CI job is the detector; the pin is what
#      makes that detection actionable rather than a surprise.
#   2. `ArjArchieve::read` compares the DECODED length against the header's
#      `original_size` ("Decompressed size does not match the original size",
#      `io::ErrorKind::InvalidData`) — and that check, inside this exact
#      version, is the whole of ARJ's declared-vs-delivered guarantee. Phase 3c
#      Task 7 made the project depend on it: `legacy::arj` adds no such
#      comparison of its own, so the fuzz oracle `check_entry_size`
#      (`fuzz/fuzz_targets/container.rs`, called for every slot including ARJ)
#      holds for ARJ only because that line exists. `arc.rs` shipped the
#      opposite shape in this same phase — a size reported from a header and
#      never compared with the bytes produced, every checksum passing, `list`
#      and `test --strict-fidelity` both reporting exact at exit 0.
#      `legacy::arj::tests::an_entry_whose_header_lies_about_its_size_is_corrupt`
#      pins the behaviour in-tree and reddens if a patch release drops it, so
#      this is documentation of an unobvious dependency rather than an open
#      hole — but do not loosen the pin without re-reading `arj_archive.rs`
#      for that comparison.
#   3. This exact version PANICS on CLI-reachable input, the smallest
#      reproducer eleven bytes long. FOUR CLASSES, not four line numbers —
#      a 4,000-archive sweep of this task's review hit 42 distinct panic
#      lines, and stating the reproducers as if they were the set is how a
#      future reader meeting `local_file_header.rs:104` in a bug report
#      concludes it is new. The classes: a MAIN header shorter than
#      `MainHeader::load_from`'s fixed prefix, a LOCAL header shorter than
#      `LocalFileHeader::load_from`'s (a different rule), either parser's
#      two unbounded `convert_string!` loops, and `decode_fastest`'s
#      `back_ptr > res.len() - 1` on an empty output. Salvage Stage 2 Task
#      6b put a guard in front of all four classes (`legacy/arj.rs`'s
#      `ArjGuardedReader`), and that guard mirrors SIX private facts of
#      0.2.1 — enumerated in its own doc comment, not here, because they are
#      read alongside the code that depends on them. Five fail safe if this
#      pin moves: a panic returns, loudly, and a named test goes red.
#      **Fact 1 does not** — `read_header`'s scan consumes both bytes of a
#      `0x60` whose successor is not `0xEA`, and a guard that stopped
#      agreeing would refuse VALID archives. That one now has a real
#      instrument rather than prose:
#      `legacy::arj::tests::the_guard_refuses_exactly_what_unarj_panics_on`
#      walks 4,000 generated archives through THIS crate twice, with the
#      guards in and out, and compares the outcomes — so it needs no private
#      offset and survives a patch bump. Before loosening this pin, run it;
#      then re-read `read_header`, both `load_from`s and `decode_fastest`
#      line by line against the new source.
delharc = { version = "=0.6.2", default-features = false, features = ["std", "lh1", "lz"] }
unarj-rs = "=0.2.1"
newtua-lzw-z = "=0.1.0"
# The LHA `-lh5-` ENCODER (Phase 3c, Task 6). `delharc` decodes and has no
# writer at all, so the write side needed a second crate; this is the only
# published pure-Rust LZH compressor in reach.
#
# Pinned exactly, for the reason the three pins above share and one of its
# own: 0.4.2 is a young crate on a fast-moving 0.4.x line, and `lha.rs`'s
# writer depends on `encode_lzh(.., LzhMethod::Lh5)` producing a stream
# `delharc` AND `lhasa` both decode — a property no version range can
# promise and only the interop tests can check.
#
# `default-features = false` and NOT `lha-oracle`: that feature implies
# `parallel`, which is the crate's ONLY optional dependency edge (`rayon`),
# and its name and its own `tests/lha_oracle.rs` say what it is — a test
# oracle that shells out to a real `lha`, not a shipping path. Default
# features are empty in 0.4.2, so this line and a bare `"=0.4.2"` resolve
# identically today; it is written out because a later release that gives
# the crate a default feature must not acquire it here silently.
#
# The whole tree is `oxiarc-lzhuf -> oxiarc-core -> thiserror`, already in
# this workspace. No `-sys` crate, no `cc`, no `bindgen`, no build script at
# all (`build = false` in both manifests) — verified with
# `cargo tree -p stuffr --features legacy -e normal,build`, the edge set that
# can see a build-dependency, which is the check `unarc-rs` failed in Phase
# 3b. Apache-2.0, the same licence `lzma-rust2` already brings to a default
# build. `rust-version = "1.85"`, below this workspace's 1.88 floor, so it
# imposes no MSRV constraint.
oxiarc-lzhuf = { version = "=0.4.2", default-features = false }
