[workspace]
members = ["crates/stuffr-core", "crates/stuffr-formats", "crates/stuffr", "crates/stuffr-cli"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/codedeviate/stf"

[workspace.dependencies]
stuffr-core = { path = "crates/stuffr-core", version = "0.0.1" }
stuffr-formats = { path = "crates/stuffr-formats", version = "0.0.1" }
thiserror = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
bzip2 = "0.6"
brotli = "8"
lz4_flex = "0.14"
snap = "1"
zstd = "0.13"
# Exact-pinned, not a caret range, and pinned BELOW `cargo add`'s own pick.
# `cargo add ruzstd` refuses 0.9.0 and 0.8.3 outright (both declare
# `rust-version = "1.87"`, above this workspace's 1.85) and lands on 0.8.2 —
# but 0.8.2 does not actually build on 1.85: it declares no `rust-version`
# at all, yet its `bit_io`/`fse`/`huff0` modules call the unsigned
# `is_multiple_of` stdlib method, stabilised in 1.87. Cargo's MSRV-aware
# resolver only reads the declared field, so it cannot see this and picks
# 0.8.2 anyway; `rustup run 1.85.0 cargo check --workspace --all-features`
# is what actually caught it. 0.8.1 predates that call and genuinely builds
# on 1.85, confirmed the same way — an ordinary "0.8.1" (caret) requirement
# would still let `cargo update` float back up to the broken 0.8.2, so this
# is `=0.8.1` rather than a range. Bumping this crate's MSRV would be the
# natural way to move past it once 0.9.0's API (verified identical to
# 0.8.1/0.8.2 for everything zstd_pure.rs uses) is worth requiring 1.87 for.
ruzstd = "=0.8.1"
# Not the bare `liblzma = "0.4"` a plain `cargo add` would produce. Default
# features pull in `bindgen` (needs libclang at build time) and, without
# `static`, `liblzma-sys`'s build.rs takes a pkg-config path linking a
# *system* liblzma instead of building one — silently fine on a developer
# machine with Homebrew's `xz` installed, broken on a clean one or CI. This
# line vendors and builds `liblzma.a` from source instead: no pkg-config, no
# system library, no libclang. Verified: zstd plus liblzma builds in ~8s.
liblzma = { version = "0.4", default-features = false, features = ["static"] }
# The pure-Rust xz backend (Task 5 of Phase 1e): a port of Tukaani's "XZ for
# Java" that both encodes and decodes, unlike zstd's decode-only pure
# fallback. Pure Rust (`sha2` + `digest`, no `-sys` crate), `rust-version =
# "1.85"` exactly on this workspace's floor, edition 2024, Apache-2.0 — the
# first non-MIT dependency reachable from a *default* build (see Task 8's
# README note).
lzma-rust2 = "0.20"
clap = { version = "4", features = ["derive"] }
