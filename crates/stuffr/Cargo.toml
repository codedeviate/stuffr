[package]
name = "stuffr"
version.workspace = true
description = "Universal compression and archive toolkit (library for the stuffr command)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["pure"]
# One passthrough feature per format, `stuffr/<name>` mirroring
# `stuffr-formats/<name>` exactly, so a caller can pick a single codec
# (`stuffr = { features = ["zstd-c"] }`) instead of the whole `pure` or
# `c-backed` bundle. `pure` and `c-backed` below are just named bundles of
# these.
gzip = ["stuffr-formats/gzip"]
zlib = ["stuffr-formats/zlib"]
deflate = ["stuffr-formats/deflate"]
bzip2 = ["stuffr-formats/bzip2"]
brotli = ["stuffr-formats/brotli"]
lz4 = ["stuffr-formats/lz4"]
snappy = ["stuffr-formats/snappy"]
zstd-c = ["stuffr-formats/zstd-c"]
zstd-pure = ["stuffr-formats/zstd-pure"]
xz-c = ["stuffr-formats/xz-c"]
xz-pure = ["stuffr-formats/xz-pure"]
lzma-c = ["stuffr-formats/lzma-c"]
lzma-pure = ["stuffr-formats/lzma-pure"]
lzip = ["stuffr-formats/lzip"]
tar = ["stuffr-formats/tar"]
ar = ["stuffr-formats/ar"]
cpio = ["stuffr-formats/cpio"]
zip = ["stuffr-formats/zip"]
# The four containers sit in this bundle rather than in a separate
# `containers` one, and not because they are codecs — they are not. `pure`
# means "everything this build can do without a C toolchain", which is the
# set the `purity` CI job walks (`cargo tree --features pure | grep -E
# 'zstd-sys|liblzma-sys'`). None of the `ar`, `cpio` or `zip` crates has a C
# dependency as this workspace configures it, so putting them here is what
# puts their graphs under that job — and `zip` is the one that most needs
# to be there, since its DEFAULT features do pull `zstd-sys` and the
# workspace manifest's curated feature list is the only thing stopping it.
pure = ["gzip", "zlib", "deflate", "bzip2", "brotli", "lz4", "snappy", "zstd-pure", "xz-pure", "lzma-pure", "lzip", "tar", "ar", "cpio", "zip"]
# `stuffr-formats/zip-zstd` rather than a `zip-zstd` passthrough of its own:
# it uses the weak `zip?/zstd` syntax, so it adds zstd to the zip container
# only when `zip` is ALSO enabled (which `pure` does) and never pulls the
# container in on its own. This is the one capability difference `c-backed`
# makes to a container: reading and writing a zstd-compressed zip entry.
c-backed = ["zstd-c", "xz-c", "lzma-c", "stuffr-formats/zip-zstd"]
legacy = []
full = ["pure", "c-backed", "legacy"]
serde = ["dep:serde", "stuffr-core/serde"]
# Exposes test-only instrumentation (see `ops::sync_call_count`) that would
# otherwise have no way to observe durability behavior without crashing the
# machine. Not a default for library consumers, same as `stuffr-core`'s.
# Forwards to `stuffr-core/testing` so `stuffr_core::testing` (e.g. MockCodec)
# is reachable from this crate's own tests too.
testing = ["stuffr-core/testing"]

[dependencies]
stuffr-core = { workspace = true }
stuffr-formats = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
# Self dev-dependency with `serde` and `testing` turned on: the same trick
# `stuffr-core` uses on itself, so both features are active for this crate's
# own tests without making either a default for library consumers.
stuffr = { path = ".", features = ["serde", "testing"] }
serde_json = "1"
