[package]
name = "stuffr"
version.workspace = true
description = "Universal compression and archive toolkit (library for the stf command)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["pure"]
# One passthrough feature per format, `stuffr/<name>` mirroring
# `stuffr-formats/<name>` exactly, so a caller can pick a single codec
# (`stuffr = { features = ["zstd-c"] }`) instead of the whole `pure` or
# `c-backed` bundle. `pure` and `c-backed` below are just named bundles of
# these.
gzip = ["stuffr-formats/gzip"]
zlib = ["stuffr-formats/zlib"]
deflate = ["stuffr-formats/deflate"]
bzip2 = ["stuffr-formats/bzip2"]
brotli = ["stuffr-formats/brotli"]
lz4 = ["stuffr-formats/lz4"]
snappy = ["stuffr-formats/snappy"]
zstd-c = ["stuffr-formats/zstd-c"]
zstd-pure = ["stuffr-formats/zstd-pure"]
xz-c = ["stuffr-formats/xz-c"]
# Task 5 adds `xz-pure = ["stuffr-formats/xz-pure"]` and puts it in `pure`
# below, mirroring `zstd-pure`. Left out here: xz's pure backend does not
# exist yet, and `pure` must stay a build any caller can actually make today.
pure = ["gzip", "zlib", "deflate", "bzip2", "brotli", "lz4", "snappy", "zstd-pure"]
c-backed = ["zstd-c", "xz-c"]
legacy = []
full = ["pure", "c-backed", "legacy"]
serde = ["dep:serde", "stuffr-core/serde"]
# Exposes test-only instrumentation (see `ops::sync_call_count`) that would
# otherwise have no way to observe durability behavior without crashing the
# machine. Not a default for library consumers, same as `stuffr-core`'s.
# Forwards to `stuffr-core/testing` so `stuffr_core::testing` (e.g. MockCodec)
# is reachable from this crate's own tests too.
testing = ["stuffr-core/testing"]

[dependencies]
stuffr-core = { workspace = true }
stuffr-formats = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
# Self dev-dependency with `serde` and `testing` turned on: the same trick
# `stuffr-core` uses on itself, so both features are active for this crate's
# own tests without making either a default for library consumers.
stuffr = { path = ".", features = ["serde", "testing"] }
serde_json = "1"
