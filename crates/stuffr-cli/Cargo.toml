[package]
name = "stuffr-cli"
version.workspace = true
description = "The stuffr command line interface"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "stuffr"
path = "src/main.rs"

[dependencies]
stuffr = { path = "../stuffr", version = "0.2.0", features = ["serde"] }
clap = { workspace = true }
serde_json = "1"

[dev-dependencies]
# Fixture builders for the `list`/`test` integration tests: real tar and
# real gzip, independent of `stuffr-formats`' own `Tar`/gzip implementations,
# so a read-side bug there cannot also hide in the fixture that exercises it.
tar = { workspace = true }
flate2 = { workspace = true }
