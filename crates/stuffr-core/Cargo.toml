[package]
name = "stuffr-core"
version.workspace = true
description = "Core traits, stream ladder and resource governor for the stuffr toolkit"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
serde = ["dep:serde"]
testing = []

[dependencies]
thiserror = { workspace = true }
tempfile = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
stuffr-core = { path = ".", features = ["testing", "serde"] }
serde_json = "1"
