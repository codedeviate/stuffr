[package]
name = "stuffr-formats"
version.workspace = true
description = "Codec and container implementations for the stuffr toolkit"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["compression", "archive", "gzip", "zstd", "tar"]
categories = ["compression", "encoding", "filesystem"]
readme = "README.md"

[features]
default = []
gzip = ["dep:flate2"]
zlib = ["dep:flate2"]
deflate = ["dep:flate2"]
bzip2 = ["dep:bzip2"]
brotli = ["dep:brotli"]
lz4 = ["dep:lz4_flex"]
snappy = ["dep:snap"]
zstd-c = ["dep:zstd"]
zstd-pure = ["dep:ruzstd"]
xz-c = ["dep:liblzma"]
xz-pure = ["dep:lzma-rust2"]
lzma-c = ["dep:liblzma"]
lzma-pure = ["dep:lzma-rust2"]
lzip = ["dep:lzma-rust2"]
tar = ["dep:tar"]
ar = ["dep:ar"]
cpio = ["dep:cpio"]
# `dep:flate2` is load-bearing, not redundant with `gzip`/`zlib`/`deflate`.
# zip declares flate2 with `default-features = false` and its
# `deflate-flate2` feature adds no BACKEND feature, so a build of
# `--features zip` alone would give flate2 no backend at all and trip its
# own `compile_error!("You need to choose a zlib backend")` (flate2
# 1.1.10, src/lib.rs:128). This line brings in the workspace's flate2
# declaration, whose default features select `rust_backend` — the same
# `miniz_oxide` backend `gzip.rs` already uses. See the `zip` dependency's
# comment in the workspace manifest for why NOT `deflate-flate2-zlib-rs`.
zip = ["dep:zip", "dep:time", "dep:flate2"]
# Adds zstd to `zip` WITHOUT enabling the zip container itself — that is what
# the `zip?/` weak-dependency syntax buys. The facade's `c-backed` bundle
# turns this on, so a `c-backed` build that does not also ask for `pure` does
# not silently acquire a zip container it never requested, while a build with
# both gets zstd-compressed zip entries. Without it, the pure tier can read a
# standalone `.zst` (via `ruzstd`) but not a zstd-compressed zip ENTRY, since
# zip's `zstd` feature is the one that pulls `zstd-sys`.
zip-zstd = ["zip?/zstd"]
lha = ["dep:delharc"]
arj = ["dep:unarj-rs"]

# No `dep:` line, like `compress` below and for the same reason: there is no
# crate behind this one. `unarc-rs` 0.6.3 — the only reference ARC/PAK
# implementation in reach — is disqualified as a dependency (rustc 1.95 via
# `delharc = "0.8"`, vendored C++ via `unrar`, and a second zip/tar stack),
# so its test corpus is borrowed as BYTES and every decoder in
# `legacy/arc.rs` is this project's own. See that module's doc and
# `fixtures/legacy/MANIFEST.md`.
arc = []

# ZOO wraps no crate for its framing or its LZW either — same disqualification
# of `unarc-rs`, and `legacy/zoo.rs` was written against zoo 2.10's OWN C
# source instead (Debian `zoo` 2.10-28, read, never linked). The `delharc`
# edge is real and narrow: ZOO's packing method 2 is a raw `-lh5-` stream, and
# `delharc::decode::Lh5Decoder` already ships in this crate for `lha`, so that
# one layer is delegated rather than written a second time.
zoo = ["dep:delharc"]

# No `dep:` here: `newtua-lzw-z`'s only production role was supposed to be
# decoding, but its `Decoder` reads and decodes its ENTIRE input on the
# first `read()` call (measured — see `legacy/compress_z.rs`'s module doc),
# so the codec ships its own from-scratch incremental decoder instead. The
# crate is still depended on — as a `[dev-dependencies]` entry below — used
# ONLY as a second, independent implementation to cross-check that decoder
# against in tests, never on the production decode path.
compress = []

[dependencies]
stuffr-core = { workspace = true }
flate2 = { workspace = true, optional = true }
bzip2 = { workspace = true, optional = true }
brotli = { workspace = true, optional = true }
lz4_flex = { workspace = true, optional = true }
snap = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
liblzma = { workspace = true, optional = true }
lzma-rust2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
ar = { workspace = true, optional = true }
cpio = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
time = { workspace = true, optional = true }
delharc = { workspace = true, optional = true }
unarj-rs = { workspace = true, optional = true }

[dev-dependencies]
stuffr-core = { workspace = true, features = ["testing"] }
# Exact pin kept from the workspace declaration. Cross-validation oracle
# only, for `legacy::compress_z`'s own from-scratch incremental decoder —
# see that module's doc and `compress`'s comment above. Not a decoder this
# build ships.
newtua-lzw-z = { workspace = true }
