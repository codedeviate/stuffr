[package]
name = "stuffr-formats"
version.workspace = true
description = "Codec and container implementations for the stf toolkit"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
gzip = ["dep:flate2"]
zlib = ["dep:flate2"]
deflate = ["dep:flate2"]
bzip2 = ["dep:bzip2"]
brotli = ["dep:brotli"]
lz4 = ["dep:lz4_flex"]

[dependencies]
stuffr-core = { workspace = true }
flate2 = { workspace = true, optional = true }
bzip2 = { workspace = true, optional = true }
brotli = { workspace = true, optional = true }
lz4_flex = { workspace = true, optional = true }

[dev-dependencies]
stuffr-core = { workspace = true, features = ["testing"] }
