[package]
name = "stuffr-formats"
version.workspace = true
description = "Codec and container implementations for the stf toolkit"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
gzip = ["dep:flate2"]
zlib = ["dep:flate2"]
deflate = ["dep:flate2"]
bzip2 = ["dep:bzip2"]
brotli = ["dep:brotli"]
lz4 = ["dep:lz4_flex"]
snappy = ["dep:snap"]
zstd-c = ["dep:zstd"]
zstd-pure = ["dep:ruzstd"]
xz-c = ["dep:liblzma"]
# Declared now, with no dependency attached yet, purely so `#[cfg(feature =
# "xz-pure")]` in `xz_shared.rs` is a known feature rather than tripping
# `unexpected_cfgs` under `-D warnings`. Task 5 attaches `dep:lzma-rust2` to
# it and adds the pure fallback module — same shape as `zstd-pure` above
# before Task 3 landed.
xz-pure = []

[dependencies]
stuffr-core = { workspace = true }
flate2 = { workspace = true, optional = true }
bzip2 = { workspace = true, optional = true }
brotli = { workspace = true, optional = true }
lz4_flex = { workspace = true, optional = true }
snap = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
liblzma = { workspace = true, optional = true }

[dev-dependencies]
stuffr-core = { workspace = true, features = ["testing"] }
