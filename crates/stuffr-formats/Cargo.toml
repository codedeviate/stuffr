[package]
name = "stuffr-formats"
version.workspace = true
description = "Codec and container implementations for the stf toolkit"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
gzip = ["dep:flate2"]
zlib = ["dep:flate2"]
deflate = ["dep:flate2"]

[dependencies]
stuffr-core = { workspace = true }
flate2 = { workspace = true, optional = true }

[dev-dependencies]
stuffr-core = { workspace = true, features = ["testing"] }
