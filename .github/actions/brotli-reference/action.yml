name: brotli reference
description: >-
  Builds brotli 1.2.1 from the v1.2.1 tag archive and exports
  STUFFR_BROTLI_REFERENCE, the oracle of the brotli compatibility suites
  (compat_brotli*). Every job that runs those tests needs it; with CI set, the
  harness panics if the reference is missing or is not exactly 1.2.1.

# The binary is built from source, not taken from a distro: ubuntu and
# Homebrew ship other releases, and the promise is the behaviour of 1.2.1.
# The libraries are built static (BUILD_SHARED_LIBS=OFF; the project's default
# is shared), so the cached install needs no runtime libraries.
#
# brotli is MIT: its tools/brotli.c is the authority for the messages and may
# be read. The built binary is only ever RUN here, as a test oracle.

runs:
  using: composite
  steps:
    # Keyed on the version, the OS and the CPU: the install is a native build.
    - name: cache the brotli 1.2.1 install
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/brotli-1.2.1
        key: brotli-1.2.1-${{ runner.os }}-${{ runner.arch }}

    # The SHA-256 is that of the GitHub tag archive (generated by GitHub from
    # the tag, NOT a release asset), measured from two independent downloads
    # that agreed.
    - name: build brotli 1.2.1
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        url=https://github.com/google/brotli/archive/refs/tags/v1.2.1.tar.gz
        sha256=98d35d11a78dc453aebb7d10c3748f3f73ff78c8267c0dc697b8631f67bf7e8f
        src="$RUNNER_TEMP/brotli-src"
        mkdir -p "$src"
        curl -fsSL --retry 3 -o "$src/brotli-1.2.1.tar.gz" "$url"
        echo "$sha256  $src/brotli-1.2.1.tar.gz" | shasum -a 256 -c -
        tar -xzf "$src/brotli-1.2.1.tar.gz" -C "$src"
        cmake -S "$src/brotli-1.2.1" -B "$src/build" \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
        cmake --build "$src/build" --target brotli -j"$(getconf _NPROCESSORS_ONLN)"
        mkdir -p "$RUNNER_TEMP/brotli-1.2.1/bin"
        cp "$src/build/brotli" "$RUNNER_TEMP/brotli-1.2.1/bin/brotli"

    - name: use it as the reference
      shell: bash
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/brotli-1.2.1/bin"
        for l in unbrotli brcat; do ln -sf brotli "$bin/$l"; done
        echo "STUFFR_BROTLI_REFERENCE=$bin/brotli" >> "$GITHUB_ENV"
        got="$("$bin/brotli" -V)" || {
          echo "::error::the brotli reference at $bin/brotli does not start (cache hit: ${{ steps.cache.outputs.cache-hit }}); the cache is broken. This is not a missing reference." >&2
          exit 1
        }
        if [ "$got" != "brotli 1.2.1" ]; then
          echo "::error::the brotli reference says '$got', not 'brotli 1.2.1'" >&2
          exit 1
        fi
        echo "$got"
