name: zstd reference
description: >-
  Builds zstd 1.5.7 from the release tarball and exports
  STUFFR_ZSTD_REFERENCE, the oracle of the zstd compatibility suites
  (compat_zstd*). Every job that runs those tests needs it; with CI set, the
  harness panics if the reference is missing or is not exactly 1.5.7 with
  gzip, lz4, lzma and xz support.

# liblz4 is the one library NOT taken from the distro: Debian 13's liblz4-dev
# is 1.10.0 (Ubuntu 24.04's was 1.9.4, whose level 2 is the "fast" mode; 1.10.0
# added a mid-way level 2), and 1.11.0 changed the bytes of levels 1, 2 and
# 10-12 again, so
# `--format=lz4` bytes differ by liblz4 release. The reference therefore links
# a liblz4.a built from the lz4 1.11.0 release tarball (lib/ only),
# statically: the release stuffr's lz4-c tier vendors.
#
# The built zstd is dynamically linked against zlib and liblzma, so
# the cached install is only usable where those libraries are present. The
# runtime libraries are therefore installed on EVERY run, cache hit or not
# (cheap: the runners have most of them), and a verification step after the
# cache restore runs the binary and says so if the cache is broken.

inputs:
  image:
    description: >-
      The container image the job runs in, or empty on the runner's own OS.
      It is part of the cache key, so an install built on the host is never
      restored into a container (or one built in another image).
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Read from `$RUNNER_TEMP` by a step, so the path is the one the step's
    # own system sees: the runner's, or the container's mount of it.
    - name: where the install lives
      id: dir
      shell: bash
      run: echo "path=$RUNNER_TEMP/zstd-1.5.7" >> "$GITHUB_OUTPUT"

    # Keyed on the version, the OS, the CPU and the container image: the
    # install is a native build, linked against that system's libraries.
    - name: cache the zstd 1.5.7 install
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.dir.outputs.path }}
        key: zstd-1.5.7-lz4-1.11.0-${{ runner.os }}-${{ runner.arch }}${{ inputs.image && format('-{0}', inputs.image) || '' }}

    # The tarball, not a distro package: Debian and Homebrew ship other
    # builds, and the promise is byte identity with 1.5.7. The SHA-256 is the
    # one in the release's own zstd-1.5.7.tar.gz.sha256, and matches a local
    # `shasum -a 256` of the download.
    - name: install the zstd libraries (build and run time)
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = Linux ]; then
          # Root in CI's debian:trixie container, which has no sudo to lean
          # on; a runner's own user still needs it.
          sudo=; [ "$(id -u)" -eq 0 ] || sudo=sudo
          $sudo apt-get update && $sudo apt-get install -y --no-install-recommends zlib1g-dev liblzma-dev
        elif [ "$RUNNER_OS" = macOS ]; then
          brew list xz >/dev/null 2>&1 || brew install xz
        fi

    - name: build zstd 1.5.7
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        url=https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
        sha256=eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3
        src="$RUNNER_TEMP/zstd-src"
        mkdir -p "$src"
        # liblz4 1.11.0, static, from the SHA-256-verified release tarball
        # (the same one as the lz4-reference action); only lib/ is built.
        # The whole tarball is extracted: lib/Makefile includes
        # ../build/make/ since 1.11.0 (a lib/-only extraction fails there).
        lz4url=https://github.com/lz4/lz4/releases/download/v1.11.0/lz4-1.11.0.tar.gz
        lz4sha=247e5fa64da5f7b75ee3dd3bed484076396c9ebe8254d9ccf693eb62800c5e26
        curl -fsSL --retry 3 -o "$src/lz4-1.11.0.tar.gz" "$lz4url"
        echo "$lz4sha  $src/lz4-1.11.0.tar.gz" | shasum -a 256 -c -
        tar -xzf "$src/lz4-1.11.0.tar.gz" -C "$src"
        lz4prefix="$src/lz4-prefix"
        make -C "$src/lz4-1.11.0/lib" install BUILD_SHARED=no PREFIX="$lz4prefix" -j"$(getconf _NPROCESSORS_ONLN)"
        ls "$lz4prefix/lib"
        curl -fsSL --retry 3 -o "$src/zstd-1.5.7.tar.gz" "$url"
        echo "$sha256  $src/zstd-1.5.7.tar.gz" | shasum -a 256 -c -
        tar -xzf "$src/zstd-1.5.7.tar.gz" -C "$src"
        # macOS: xz comes from Homebrew (usually already on the runner), whose
        # headers and libraries are not on the default paths.
        # These are environment variables, not make arguments: the Makefile
        # appends its own -D flags to CPPFLAGS, and a command-line value
        # would replace them (the build then says "supports: zstd" only).
        # Our lz4 prefix comes FIRST and holds only liblz4.a, so -llz4 can
        # only resolve to 1.11.0 whatever else is installed.
        # zstd 1.5.7's lz4 code names the `contentChecksum_t` enum, an
        # obsolete alias lz4frame.h dropped in 1.11.0; the define maps it to
        # the current name (the build fails without it).
        export CPPFLAGS="-I$lz4prefix/include -DcontentChecksum_t=LZ4F_contentChecksum_t"
        export LDFLAGS="-L$lz4prefix/lib"
        if [ "$RUNNER_OS" = macOS ]; then
          xz_prefix="$(brew --prefix xz)"
          export CPPFLAGS="$CPPFLAGS -I$xz_prefix/include"
          export LDFLAGS="$LDFLAGS -L$xz_prefix/lib"
        fi
        make -C "$src/zstd-1.5.7/programs" zstd-release HAVE_ZLIB=1 HAVE_LZMA=1 HAVE_LZ4=1 HAVE_THREAD=1 -j"$(getconf _NPROCESSORS_ONLN)"
        mkdir -p "$RUNNER_TEMP/zstd-1.5.7/bin"
        cp "$src/zstd-1.5.7/programs/zstd" "$RUNNER_TEMP/zstd-1.5.7/bin/zstd"

    - name: use it as the reference
      shell: bash
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/zstd-1.5.7/bin"
        for l in unzstd zstdcat zstdmt; do ln -sf zstd "$bin/$l"; done
        echo "STUFFR_ZSTD_REFERENCE=$bin/zstd" >> "$GITHUB_ENV"
        # liblz4 is linked statically; this line is the proof of which one.
        echo "zstd reference: liblz4 1.11.0 static (tarball); dynamic lz4 references: $( { ldd "$bin/zstd" || otool -L "$bin/zstd"; } 2>&1 | grep -ci lz4 || true )"
        if ! "$bin/zstd" -vV; then
          echo "::error::the zstd reference at $bin/zstd does not start (cache hit: ${{ steps.cache.outputs.cache-hit }}); its shared libraries are missing or the cache is broken. This is not a missing reference." >&2
          exit 1
        fi
