name: xz reference
description: >-
  Builds XZ Utils 5.8.4 from the release tarball and exports
  STUFFR_XZ_REFERENCE, the oracle of the xz compatibility suites
  (compat_xz*). Every job that runs those tests needs it; with CI set, the
  harness panics if the reference is missing or is not exactly 5.8.4.

inputs:
  image:
    description: >-
      The container image the job runs in, or empty on the runner's own OS.
      It is part of the cache key, so an install built on the host is never
      restored into a container (or one built in another image).
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Read from `$RUNNER_TEMP` by a step, so the path is the one the step's
    # own system sees: the runner's, or the container's mount of it.
    - name: where the install lives
      id: dir
      shell: bash
      run: echo "path=$RUNNER_TEMP/xz-5.8.4" >> "$GITHUB_OUTPUT"

    # Keyed on the version, the OS, the CPU and the container image: the
    # install is a native build, linked against that system's libraries.
    - name: cache the xz 5.8.4 install
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.dir.outputs.path }}
        key: xz-5.8.4-${{ runner.os }}-${{ runner.arch }}${{ inputs.image && format('-{0}', inputs.image) || '' }}

    # The tarball, not a distro package: Debian and Homebrew ship other
    # releases, and the promise is byte identity with 5.8.4. The SHA-256 was
    # recorded from a download whose detached signature (key 3690C240CE51B467
    # 0D30AD1C38EE757D69184620, Lasse Collin) gpg reported as good.
    - name: build xz 5.8.4
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        url=https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.gz
        sha256=0014c7886930454fe8bd4228665b51af55eeae560ea135c9c4cd33f55b2591d9
        src="$RUNNER_TEMP/xz-src"
        mkdir -p "$src"
        curl -fsSL --retry 3 -o "$src/xz-5.8.4.tar.gz" "$url"
        echo "$sha256  $src/xz-5.8.4.tar.gz" | shasum -a 256 -c -
        tar -xzf "$src/xz-5.8.4.tar.gz" -C "$src"
        cd "$src/xz-5.8.4"
        ./configure --disable-nls --disable-shared --prefix="$RUNNER_TEMP/xz-5.8.4"
        make -j"$(getconf _NPROCESSORS_ONLN)"
        make install

    - name: use it as the reference
      shell: bash
      run: |
        set -euo pipefail
        xz="$RUNNER_TEMP/xz-5.8.4/bin/xz"
        echo "STUFFR_XZ_REFERENCE=$xz" >> "$GITHUB_ENV"
        "$xz" --version
        "$xz" --robot --version
