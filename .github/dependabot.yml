# Keeps the SHA-pinned actions and the Cargo locks current. Pull requests run
# CI like any other; nothing merges itself.
version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the composite reference-tool actions beside them.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
