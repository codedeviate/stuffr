name: fuzz (deep, scheduled)

# The counterpart to ci.yml's `fuzz-smoke` job: that job is short and seeded on
# purpose (Ruling G — a few thousand runs per target, a few seconds each),
# which is what earns it the right to run on every push and PR without slowing
# them down. This workflow trades that fixed, small budget for depth: it runs
# on a schedule and gives each target real wall-clock time, so what it covers
# depends on runner load by design.
#
# Note that the smoke job is NOT the deterministic half of this pairing, even
# though its budget is fixed — see ci.yml's Ruling G comment for the
# measurement (same seed and corpus, 3/5 then 2/5 crashes across identical
# re-runs: `-seed=` fixes the mutation PRNG, not corpus directory order or
# entropic scheduling). The real distinction between the two jobs is budget
# shape — a fixed run count that cannot slow a PR down, versus wall-clock time
# that can go deep — not reproducible versus not. Both are false-negative-only:
# either may miss a crash, neither invents one.
#
# Ruling I's "pure tier only" reasoning does NOT apply here on principle —
# this is exactly the workflow a `--features c-backed` pass would belong in if
# one is ever wanted — but none is added yet: nothing has motivated the extra
# time cost so far, and adding it is a one-line change to the matrix below
# when it is.

on:
  schedule:
    # Once a week (Sunday, 03:17 UTC — off the hour to avoid the scheduling
    # pile-up GitHub warns about at :00). Deep fuzzing is exploratory, not a
    # release gate, so weekly is enough cadence to be worth the runner time
    # without competing for capacity with `ci.yml` on every push.
    - cron: "17 3 * * 0"
  # Lets a maintainer kick off a deep run on demand (e.g. right after a
  # change to a codec/container's decode path) without waiting for Sunday.
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fuzz-deep:
    name: fuzz deep (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Ruling J: a scheduled workflow must not run in a fork of this
    # repository. `schedule` events aren't delivered to forks by GitHub in
    # the first place unless a fork owner has separately enabled Actions and
    # recreated the schedule themselves, but `workflow_dispatch` above can be
    # triggered manually from a fork — this guard is what actually closes
    # that gap, not the schedule trigger's own default behaviour.
    if: github.repository == 'codedeviate/stuffr'
    strategy:
      fail-fast: false
      matrix:
        target: [codec, container, chain, roundtrip, salvage]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          # See ci.yml's `fuzz-smoke` job: `fuzz/` is excluded from the
          # workspace and builds into its own `fuzz/target`, not the
          # workspace's `target/`.
          workspaces: "fuzz -> target"
      # See ci.yml's `fuzz-smoke` job for why this is necessary at all:
      # rust-toolchain.toml pins 1.95, and cargo-fuzz needs nightly.
      - run: rm rust-toolchain.toml
      # Same pin and same reasoning as ci.yml's `fuzz-smoke` job: cargo-fuzz
      # has no prebuilt binary on this image, and pinning is what makes the
      # cache key meaningful (bump both together, deliberately).
      - name: cache cargo-fuzz binary
        id: cache-cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}
      - name: install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # Generated, not committed (`fuzz/.gitignore`'s `/corpus`) — regenerated
      # fresh for every scheduled run, exactly as ci.yml's smoke job does.
      # `salvage` (Salvage Stage 1 Task 8) is not part of this step: it has no
      # seed generator, so its matrix entry below runs from an empty corpus
      # directory (`cargo fuzz run` creates one if it is missing) — real
      # wall-clock iterations, just unseeded, same as ci.yml's smoke job.
      - run: make fuzz-corpus
      # Real time, not a fixed `-runs=`, unlike the smoke job: this workflow
      # exists specifically to spend wall-clock time the smoke job's Ruling-G
      # determinism budget can't afford. 20 minutes per target keeps the
      # three-way matrix under GitHub's per-job limits with headroom for
      # queueing, while still being an order of magnitude deeper than the
      # smoke job's few seconds.
      - name: fuzz ${{ matrix.target }} (20 minutes)
        run: |
          cmd="cargo fuzz run ${{ matrix.target }} -- -max_total_time=1200"
          echo "==> $cmd"
          $cmd
      # A red scheduled run is opened by whoever gets the email, possibly
      # weeks later and not necessarily the person who wrote the target, so
      # the triage instructions go in the failed job's own log rather than in
      # a comment nobody opens the file to read. The 20-minute budget is
      # deliberately NOT reduced to make red runs rarer: depth is the entire
      # reason this workflow exists, and a job tuned to find less is not the
      # answer to a job whose findings nobody can interpret.
      #
      # There is no known-crash exemption to state here, deliberately. The one
      # crash this workflow was expected to ship red on — the 568-byte zip
      # whose central directory reaches nothing, which needed roughly 16,500
      # runs to rediscover — is FIXED (`zip.rs`'s
      # `refuse_an_index_that_reaches_nothing`), and the parked reproducer was
      # verified to run clean through this target afterwards. A red run
      # therefore means a NEW finding, which is the first thing a triager
      # needs to know. If a crash is ever knowingly parked again, THIS is
      # where it must be named: a scheduled job that is red by construction,
      # with nothing saying so, trains people to ignore it, and then it is
      # worth nothing.
      - name: how to triage this failure
        if: failure()
        run: |
          cat <<'TRIAGE'
          A deep fuzz run found something. There are no knowingly-parked
          crashes in this workflow, so treat this as a new finding.

          1. Download the `fuzz-crash-${{ matrix.target }}` artifact from this
             run's summary page. It holds the crashing input, one file.

          2. Reproduce it locally (nightly + cargo-fuzz 0.13.2):

                 make fuzz-corpus
                 cargo +nightly fuzz run ${{ matrix.target }} PATH/TO/INPUT

             A single named input runs once and exits 77 on a finding, 0 if it
             no longer reproduces.

          3. The panic message names the invariant that failed — one of
             check_error_is_classified, check_entry_size, check_entry_count or
             check_fidelity_claim. Read that function's doc comment in
             crates/stuffr-core/src/honesty.rs FIRST: each one states what it
             deliberately permits, and several findings in this project's
             history were the oracle being too strict rather than the code
             being wrong.

          4. To reproduce at the CLI instead: the `codec` and `container`
             targets' inputs carry a leading SELECTOR byte that is not part of
             the stream — its low 7 bits index CODEC_SLOTS/CONTAINER_SLOTS
             (crates/stuffr-core/src/testing.rs) and its high bit picks the
             seekable rung. Strip it (`tail -c +2`) to get the bytes stuffr
             itself would read. `chain` inputs carry no selector byte.

          5. Crash artifacts are kept for 30 days. Copy the input out of the
             artifact before then, or the finding is lost with it.
          TRIAGE
      # Ruling J: a crash input that only lives on the runner's disk is a
      # wasted run — the runner is torn down the moment the job ends. This
      # step is `if: failure()` so it uploads exactly when the step above
      # crashed (a timeout with nothing found exits 0 and skips this).
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: warn
          retention-days: 30
