name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  gate:
    name: gate (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # `make check`'s lint and fmt steps now reach `fuzz/` as well as the
          # workspace, and `fuzz/` is `exclude`d from the workspace so it has
          # its OWN `target/`. The default config caches only the workspace's,
          # so without the second entry this job rebuilds `libfuzzer-sys` and
          # the whole fuzz dependency tree from scratch on every run. The
          # first entry is the default and must be restated: naming
          # `workspaces` replaces the default rather than adding to it.
          #
          # This is the ONLY job that needs it — `msrv` and `c-backed` invoke
          # `cargo` against the workspace directly, and the workspace excludes
          # `fuzz/`. Verified by reading each job's own run steps, not assumed
          # from the job names.
          workspaces: |
            . -> target
            fuzz -> target
      # rust-toolchain.toml pins 1.95 for local development, and rustup
      # honours it for every `cargo` invocation regardless of which toolchain
      # actions/steps selected above — without removing it, this job's
      # `dtolnay/rust-toolchain@stable` step is inert and "gate (stable)"
      # silently runs on 1.95 instead of stable.
      - run: rm rust-toolchain.toml
      # `lzip.rs`'s reference-tool tests go through `require_lzip`, which
      # PANICS rather than skipping if the binary is absent — `ar.rs`,
      # `cpio.rs` and `zip.rs`'s `require_bin` use the same convention.
      # `ubuntu-latest` doesn't ship `lzip` (unlike `xz`, which is already on
      # the image), so without this install every one of those tests turns
      # this job red rather than silently no-op'ing — which is deliberate
      # (Finding 8 of the Phase 1e final review: a silent skip here once let
      # the trailing-data rule that took two review rounds to get right go
      # unexercised in CI). `cpio` is the same story for `cpio.rs`'s own
      # reference-tool test: `ubuntu-latest` ships `unzip`, GNU `tar` and
      # `ar` (binutils) but not `cpio` (Phase 1e's Finding 8, repeating —
      # Phase 2's Task 10 brief calls this out by name).
      # `zip` and `unzip` are named too, though `ubuntu-latest` already
      # ships both: `zip.rs`'s cross-implementation tests go through
      # `require_bin` as well, so an image change that dropped either would
      # turn this job red with a confusing "reference tool missing" failure
      # instead of installing it. Naming them here makes the dependency
      # explicit and costs nothing when they are already present.
      # `lhasa` joined the list in Phase 3c Task 6, when LHA gained an
      # encoder and `lha.rs` gained the only test that can prove what it
      # writes is genuinely LHA rather than something `oxiarc-lzhuf` and
      # `delharc` merely agree about. Two things about it are easy to get
      # wrong and both are load-bearing:
      #   * The PACKAGE is `lhasa`, and so is the BINARY it installs here —
      #     `/usr/bin/lhasa`, per the Debian bookworm and Ubuntu noble file
      #     lists, with no `lha` at all. Homebrew's formula of the same name
      #     installs the same program as `lha`. `require_lhasa` (in
      #     `legacy/lha.rs` and again in `cli.rs`) tries both names for
      #     exactly that reason.
      #   * It belongs on ALL THREE of these lines, the `c-backed` one
      #     included. That is measured, not assumed: `cargo test --workspace
      #     --no-default-features --features c-backed -p stuffr-formats --lib
      #     -- --list` lists `legacy::lha::tests::lhasa_reads_what_we_write`,
      #     so that job runs the test and panics without the tool.
      # `tar.rs`'s own cross-implementation test is the one holdout: it
      # counts how many of `tar`, `gtar` and `python3` are on PATH and only
      # asserts that at least one was tried, rather than requiring a named
      # binary — deliberate, because it is a multi-writer fallback test, not
      # a single-reference-tool one, and every candidate it lists is already
      # part of this image or the base image. (`python3` is not named here:
      # it is part of the base image and cannot be absent.)
      - run: sudo apt-get update && sudo apt-get install -y lzip cpio zip unzip ncompress lhasa
      # The same command CONTRIBUTING.md tells a human to run — but NOT the
      # same toolchain, and not the same platform. The `rm` above puts this
      # job on current stable while `rust-toolchain.toml` keeps local runs on
      # 1.95, so a newer stable's clippy can turn this job red with no code
      # change (it has: four `collapsible_if` errors on 1.98). The cgroup
      # code is also `cfg(target_os = "linux")`, so a macOS `make check`
      # never compiles it at all. To reproduce this job locally before
      # pushing:
      #
      #   cargo +stable clippy --workspace --all-targets --all-features \
      #     --target x86_64-unknown-linux-gnu -- -D warnings
      - run: make check

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins 1.95 for local development and must not
      # constrain the MSRV check. Remove it so the toolchain action's choice
      # takes effect.
      - run: rm rust-toolchain.toml
      # See "gate"'s identical step: without this, lzip's, cpio's and zip's
      # reference-tool tests (all `require_*`/`require_bin`, all PANIC on
      # absence) turn this job red rather than silently no-op'ing.
      - run: sudo apt-get update && sudo apt-get install -y lzip cpio zip unzip ncompress lhasa
      # rust-version claims 1.88 and this job is the only thing that checks it.
      # The floor was 1.85 through Phase 1d; it moved because holding it forced an
      # exact pin on a dependency, which blocked patch-level security fixes, and
      # because let-chains (stable in 1.88) were being routed around in every task.
      - run: cargo build --workspace --all-features
      - run: cargo test --workspace --all-features
      # The pure tier is a different test set, not a subset — see the
      # `test-pure` target in the Makefile for why.
      - run: cargo test --workspace

  c-backed:
    name: c-backed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins 1.95 for local development, which would
      # otherwise make the toolchain selection above inert (see "gate"'s
      # identical step).
      - run: rm rust-toolchain.toml
      # The first job in this project's history that needs a C compiler on
      # the runner — and it needs nothing else. `zstd` vendors its own C
      # source and builds it statically by default, and `liblzma` is pinned
      # to `{ version = "0.4", default-features = false, features =
      # ["static"] }` specifically so it never reaches for `libclang` (for
      # bindgen) or a system liblzma via pkg-config. Do NOT add an
      # `apt-get install` step "to be safe" — that would mask a regression
      # back to the pkg-config path, which is the failure this job's minimal
      # setup exists to catch. If this job ever fails for a missing system
      # library, that is the bug, not the runner.
      - run: cargo build --workspace --no-default-features --features c-backed
      # Reference TOOLS, installed deliberately after the build above and
      # never before it. The build is what proves the no-system-library
      # property — linking happens there — so the guard the comment above
      # describes is fully intact at the moment it matters. What follows is
      # `cargo test`, and `lzip.rs`, `cpio.rs` and `zip.rs` each require a
      # named reference binary through a panicking `require_bin`/
      # `require_lzip`: absent, they fail loudly rather than proving nothing.
      # None of these packages ships a `liblzma` pkg-config file, so none can
      # mask the pkg-config regression this job exists to catch.
      #
      # This job went red on the v0.2.0 push for exactly this: Phase 2 turned
      # lzip's silent skip into a hard requirement on the stated grounds that
      # "CI already installs lzip unconditionally" — which was checked against
      # `gate` and `msrv`, both of which do, and not against this job, which
      # did not. 11 lzip tests panicked.
      - run: sudo apt-get update && sudo apt-get install -y lzip cpio zip unzip ncompress lhasa
      - run: cargo test --workspace --no-default-features --features c-backed

  miri:
    name: miri (the two unsafe regions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins 1.95 for local development, which would
      # otherwise make the nightly selection above inert (see "gate"'s
      # identical step). Miri only exists on nightly.
      - run: rm rust-toolchain.toml
      # `tar.rs` and `ar.rs` hold the workspace's only two `unsafe` regions:
      # a self-referential struct each, an owning box leaked with
      # `Box::into_raw` so a borrowed iterator can live beside the archive it
      # borrows from, reclaimed in `Drop`. Both are Miri-clean under Stacked
      # Borrows and Tree Borrows, and until this job existed nothing
      # protected that fact against a refactor. See CONTRIBUTING.md's
      # "`unsafe`" section for the policy this enforces.
      #
      # NOT part of the `gate` job: Miri is 10-50x slower than a native run
      # and `make check` is meant to be run after every edit. Separate job,
      # same PR.
      #
      # No `apt-get` step, unlike `gate`: `make miri` skips every
      # subprocess-based interop test by name, because Miri cannot spawn a
      # process at all. Installing the reference tools here would buy
      # nothing.
      - run: make miri

  fuzz-smoke:
    name: fuzz smoke (codec, container, chain, roundtrip, salvage — pure tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          # `fuzz/` is excluded from the workspace (its own Cargo.toml,
          # `publish = false`) and cargo-fuzz builds it into `fuzz/target`,
          # not the workspace's own `target/` — the default rust-cache
          # config here would cache the latter and miss this job's actual
          # build output entirely.
          workspaces: "fuzz -> target"
      # rust-toolchain.toml pins 1.95 for local development, and rustup
      # honours it for every `cargo` invocation regardless of which
      # toolchain actions/steps selected above — see "gate" and "miri"'s
      # identical step. `cargo fuzz` needs the nightly compiler (it passes
      # `-Zsanitizer=address` to rustc), and without removing this file
      # `dtolnay/rust-toolchain@nightly` is inert and every `cargo fuzz`
      # call below fails with "the option `Z` is only accepted on the
      # nightly compiler" — reproduced locally while writing this job.
      - run: rm rust-toolchain.toml
      # cargo-fuzz ships no prebuilt binary and isn't on the runner image.
      # Pinned to the version this job was written and verified against
      # (0.13.2); cached below so a warm run doesn't recompile it from
      # scratch. Bump deliberately, the same way the rest of this project
      # pins tool versions it depends on.
      - name: cache cargo-fuzz binary
        id: cache-cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}
      - name: install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # Generated, not committed (`fuzz/.gitignore`'s `/corpus`). Without
      # this step every target below would fuzz from nothing — much worse
      # coverage, since each run would start from a blank slate instead of
      # the seeds that reach every registered format.
      #
      # Note what that failure is NOT: it is not caught by the execution-
      # count check two steps down. An empty corpus still EXECUTES —
      # libFuzzer performs its `-runs=N` mutation passes from nothing and
      # reports a full `Done N runs` (measured directly: `codec` against an
      # emptied `fuzz/corpus/codec` reported `Done 2000 runs`, exit 0). The
      # execution-count check catches a different scenario: a target that
      # returns early on every input, or a run that never really started —
      # anything that exits 0 without libFuzzer printing a non-zero summary
      # line. Both failures are worth preventing; only one of them is
      # prevented HERE, and an earlier version of this comment claimed
      # otherwise.
      - run: make fuzz-corpus
      # Ruling I: pure tier only. `stuffr-fuzz` depends on `stuffr` (and
      # `stuffr-core`) with no `c-backed` feature, so this already fuzzes
      # the default/pure selection. The two build tiers register different
      # IMPLEMENTATIONS behind the same slot names (see `stuffr-core`'s
      # `testing::CODEC_SLOTS`/`CONTAINER_SLOTS` and the Makefile's own
      # `test`/`test-pure` split for the identical reasoning) — fuzzing
      # `--features c-backed` here too would double this job's time for a
      # second pass over the same surface, not new coverage. The scheduled
      # deep workflow (`fuzz-deep.yml`) is where that tier would be added
      # if ever wanted.
      #
      # Phase 3b: `fuzz/Cargo.toml` also enables `legacy` (`compress`, `lha`,
      # `arj`) alongside `testing`. That is orthogonal to this ruling, not an
      # exception to it: `legacy` has no C dependency (`delharc`, `unarj-rs`
      # are pure Rust; `compress`'s own decoder has none at all), so it stays
      # on the pure/no-C-toolchain side of the split this job's name refers
      # to — it is simply a feature this job's build did not carry before
      # these three read-only formats existed to fuzz.
      #
      # Ruling G: fixed `-runs=N`, not `-max_total_time=N` — a time budget
      # makes coverage depend on runner load, so the same commit fuzzes a
      # different amount every run. Fixed `-seed=` so the mutation sequence
      # is reproducible, and the exact `cargo fuzz run ...` command is
      # echoed so a developer can copy it straight out of a red log. This
      # job is NOT part of `gate` for the same reason `miri` isn't: `make
      # check` runs after every edit, and a seeded fuzz pass — however
      # short — is not that.
      #
      # What a fixed `-runs` and `-seed` do NOT buy, and it matters: this
      # job is NOT deterministic. Measured on the `container` target, same
      # seed, same corpus, five identical re-runs: 3 of 5 found a crash on
      # one pass and 2 of 5 on the next. The seed fixes libFuzzer's own
      # mutation PRNG, not the order it walks the corpus directory or its
      # entropic scheduling, and both feed the mutator. So a green
      # `fuzz-smoke` is not proof of absence — the same commit, seed and
      # corpus can find a crash on the next push.
      #
      # It still earns the right to block, because the flakiness is
      # FALSE-NEGATIVE ONLY: a seeded run may miss a crash it found before,
      # but it never reports one that did not happen. A red `fuzz-smoke` is
      # always a real finding; a green one is "nothing found this pass".
      # Treat a crash that will not reproduce from the echoed command as
      # expected, not as a flaky test to be quieted — re-run it, or hand
      # the artifact in `fuzz/artifacts/` to `cargo fuzz run <target>
      # <artifact>`, which IS deterministic.
      #
      # Ruling H: a corpus that silently failed to generate, or a target
      # stubbed to return early on every input, would otherwise exit 0 and
      # print output indistinguishable from a clean run. This step parses
      # libFuzzer's own "Done N runs" summary line and fails if the count
      # is zero or the line is missing entirely (the latter is what happens
      # when a target crashes or exits before printing it — verified by
      # temporarily stubbing `codec.rs`'s target to `std::process::exit(0)`
      # at its top: the run then exits with no "Done N runs" line at all,
      # and this check correctly refuses it. See task-5-report.md for the
      # quoted failure).
      - name: fuzz all five targets (short, seeded; see Ruling G — not deterministic)
        run: |
          set -u
          FUZZ_RUNS=2000
          FUZZ_SEED=1
          status=0
          # `salvage` (Salvage Stage 1 Task 8) has no seeded corpus of its own
          # — `make fuzz-corpus` deliberately does not generate one, since no
          # generator here produces a plausible damaged zip to seed from — so
          # it runs from nothing here, same as every local `make fuzz`. It
          # still executes real libFuzzer iterations and the count check
          # below still applies to it.
          for target in codec container chain roundtrip salvage; do
            cmd="cargo fuzz run $target -- -runs=$FUZZ_RUNS -seed=$FUZZ_SEED"
            echo "==> $cmd"
            log=$(mktemp)
            if ! $cmd >"$log" 2>&1; then
              echo "::error::fuzz target '$target' crashed (or otherwise exited non-zero) — see output below"
              cat "$log"
              status=1
              continue
            fi
            # `|| true` is load-bearing HERE and absent from the identical
            # line in the Makefile, on purpose. GitHub Actions runs a `run:`
            # block under `bash -e -o pipefail`, so a no-match grep pipeline
            # would abort this whole script via `set -e` before reaching the
            # explicit zero-count check below — which is the check that turns
            # "no summary line" into a reported failure rather than a silent
            # one. A make recipe runs under a plain `/bin/sh` with no `-e`,
            # so `Makefile`'s copy must NOT have it: there, `|| true` would
            # be harmless but pointless, and adding `-e` to that recipe to
            # "match" would break the recipe's own `continue`-and-collect
            # loop. Do not tidy either half into agreeing with the other.
            count=$(grep -oE 'Done [0-9]+ runs' "$log" | tail -1 | grep -oE '[0-9]+' || true)
            if [ -z "$count" ] || [ "$count" -eq 0 ]; then
              echo "::error::fuzz target '$target' reported zero (or no) executions in its libFuzzer summary — treating this as a failure, not a clean run"
              cat "$log"
              status=1
              continue
            fi
            echo "fuzz target '$target': $count executions — OK"
          done
          exit $status

  purity:
    name: purity (pure pulls in no C-compiling crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rm rust-toolchain.toml
      # Structural, not environmental: this cannot prove `cc` is absent from
      # a runner (runners have compilers), only that a default `pure` build
      # never reaches for `zstd-sys` or `liblzma-sys` in the first place.
      # The exit code is inverted on purpose: `grep` succeeding means it
      # FOUND a C-compiling crate, which is the failure.
      - name: pure builds pull in no C-compiling crate
        run: |
          cargo tree -p stuffr --no-default-features --features pure -e normal \
            | grep -E 'zstd-sys|liblzma-sys' && exit 1
          echo "pure graph is free of C-compiling crates"
