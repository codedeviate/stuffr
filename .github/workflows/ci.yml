name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  gate:
    name: gate (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins 1.95 for local development, and rustup
      # honours it for every `cargo` invocation regardless of which toolchain
      # actions/steps selected above — without removing it, this job's
      # `dtolnay/rust-toolchain@stable` step is inert and "gate (stable)"
      # silently runs on 1.95 instead of stable.
      - run: rm rust-toolchain.toml
      # `lzip.rs`'s reference-tool tests (`which_lzip`) skip silently when
      # the binary is absent from PATH — correct behaviour for a
      # contributor's machine, but `ubuntu-latest` doesn't ship it (unlike
      # `xz`, which is already on the image), so without this install the
      # trailing-data rule that took two review rounds to get right was
      # never actually exercised in CI (Finding 8 of the Phase 1e final
      # review).
      - run: sudo apt-get update && sudo apt-get install -y lzip
      # The same command CONTRIBUTING.md tells a human to run, so a green
      # local run and a green pipeline mean the same thing.
      - run: make check

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins 1.95 for local development and must not
      # constrain the MSRV check. Remove it so the toolchain action's choice
      # takes effect.
      - run: rm rust-toolchain.toml
      # See "gate"'s identical step: without this, lzip's reference-tool
      # tests silently no-op on this runner too.
      - run: sudo apt-get update && sudo apt-get install -y lzip
      # rust-version claims 1.88 and this job is the only thing that checks it.
      # The floor was 1.85 through Phase 1d; it moved because holding it forced an
      # exact pin on a dependency, which blocked patch-level security fixes, and
      # because let-chains (stable in 1.88) were being routed around in every task.
      - run: cargo build --workspace --all-features
      - run: cargo test --workspace --all-features
      # The pure tier is a different test set, not a subset — see the
      # `test-pure` target in the Makefile for why.
      - run: cargo test --workspace

  c-backed:
    name: c-backed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins 1.95 for local development, which would
      # otherwise make the toolchain selection above inert (see "gate"'s
      # identical step).
      - run: rm rust-toolchain.toml
      # The first job in this project's history that needs a C compiler on
      # the runner — and it needs nothing else. `zstd` vendors its own C
      # source and builds it statically by default, and `liblzma` is pinned
      # to `{ version = "0.4", default-features = false, features =
      # ["static"] }` specifically so it never reaches for `libclang` (for
      # bindgen) or a system liblzma via pkg-config. Do NOT add an
      # `apt-get install` step "to be safe" — that would mask a regression
      # back to the pkg-config path, which is the failure this job's minimal
      # setup exists to catch. If this job ever fails for a missing system
      # library, that is the bug, not the runner.
      - run: cargo build --workspace --no-default-features --features c-backed
      - run: cargo test --workspace --no-default-features --features c-backed

  purity:
    name: purity (pure pulls in no C-compiling crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rm rust-toolchain.toml
      # Structural, not environmental: this cannot prove `cc` is absent from
      # a runner (runners have compilers), only that a default `pure` build
      # never reaches for `zstd-sys` or `liblzma-sys` in the first place.
      # The exit code is inverted on purpose: `grep` succeeding means it
      # FOUND a C-compiling crate, which is the failure.
      - name: pure builds pull in no C-compiling crate
        run: |
          cargo tree -p stuffr --no-default-features --features pure -e normal \
            | grep -E 'zstd-sys|liblzma-sys' && exit 1
          echo "pure graph is free of C-compiling crates"
