# cargo-deny: advisories, licences, bans and sources for the whole graph.
# Run with `make deny` (needs `cargo install --locked cargo-deny`); CI runs it
# on every push. `cargo audit` covers `fuzz/Cargo.lock`, which is a separate
# workspace this file does not see.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check, unmaintained and unsound notices
# included, except one we have read and recorded below with the reason.
ignore = []

[licenses]
# The licences in the graph today, by name. A new one fails the check, so it
# is read before it ships: the crates' own SPDX line (Cargo.toml) has to grow
# to match whatever a new dependency brings in.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "CC0-1.0",
    "Info-ZIP",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace carry a version as well, so the
# wildcard rule does not fire on them.
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
